{% extends "base.html" %}

{% block title %}
Cancel Reservation
{% endblock %}

{% block content %}

<h2>Cancel Reservation</h2>

<p>
    Are you sure you want to cancel this reservation?
</p>

<form method="post">
    {% csrf_token %}

    <button type="submit" class="btn btn-danger">
        Cancel
    </button>

    <a href="{% url 'reservation_list' %}" class="btn btn-secondary">
        Back
    </a>
</form>

{% endblock %}
