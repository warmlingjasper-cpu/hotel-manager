{% load static %}
<!DOCTYPE html>
<html lang="eng">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        Hotel Manager
        {% endblock %}
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

</head>

<body>
    <div class="container mt-4">

        <h1>Hotel Manager</h1>

        <nav class="mb-4">
            <a class="btn btn-outline-primary" href="{% url 'dashboard' %}">Dashboard</a> |
            <a class="btn btn-outline-primary" href="{% url 'room_list' %}">Rooms</a> |
            <a class="btn btn-outline-primary" href="{% url 'guest_list' %}">Guests</a> |
            <a class="btn btn-outline-primary" href="{% url 'reservation_list' %}">Reservations</a> |

            <button id="theme-toggle" class="btn btn-dark btn-sm">
                🌙
            </button>

        </nav>

        {% block content %}

        {% endblock %}

    </div>

    <script>

        const toggleButton = document.getElementById("theme-toggle");

        if (localStorage.getItem("theme") === "dark") {
            document.body.classList.add("dark-mode");
            toggleButton.innerHTML = "☀️";
        }

        toggleButton.addEventListener("click", function () {
            document.body.classList.toggle("dark-mode");

            if (document.body.classList.contains("dark-mode")) {
                localStorage.setItem("theme", "dark");
                toggleButton.innerHTML = "☀️";
            } else {
                localStorage.setItem("theme", "light");
                toggleButton.innerHTML = "🌙";
            }

        });
    </script>

</body>

</html>
