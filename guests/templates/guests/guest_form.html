{% extends "base.html" %}

{% block content %}


<h2>Add Guest</h2>

    <div class="mb-3">
        <label class="form-label">Guest ID:</label>
        {{ guest.id }}
    </div>

<form method="POST">
    
    {% csrf_token %}

    {{ form.as_p }}


    <button type="submit" class="btn btn-primary">
        Save
    </button>

    <a href="{% url 'guest_list' %}" class="btn btn-secondary">
                Cancel
            </a>

</form>

{% endblock %}
